<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triolet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b5a8e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triolet">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f2c14e;--ink:#f6f1e3;--panel:rgba(12,34,60,.82);--wood1:#4a321d;--wood2:#2e1f11}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;background:#0e2a47;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column}
.btn{font-family:inherit;font-size:15px;font-weight:600;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:#2b5680;color:var(--ink);transition:transform .1s,background .15s,opacity .15s;white-space:nowrap}
.btn:hover:not(:disabled){background:#37699a}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#2a1d07}
.btn.primary:hover:not(:disabled){background:#ffd468}
.btn.ghostbtn{background:transparent;border:1px solid rgba(255,255,255,.2)}
.btn.small{padding:6px 10px;font-size:13px}

#boardWrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#7cc3e6 0%,#4a9fd0 50%,#2573ad 100%);touch-action:none}
#board{width:100%;height:100%;display:block;cursor:grab}
#board.panning{cursor:grabbing}
#world.smooth{transition:transform .45s cubic-bezier(.3,.8,.3,1)}
#tiles>g,#ghostL>g{filter:drop-shadow(1px 2.5px 1.5px rgba(0,0,0,.42))}
.body{fill:url(#tg);stroke:url(#tg);stroke-width:9;stroke-linejoin:round}
.bevel{display:none}
.hlp{fill:none;stroke:none;stroke-width:13;stroke-linejoin:round}
.tbar{fill:#1c1c1c}
.tdot{fill:url(#dotg);stroke:#b8860b;stroke-width:.5}
.tnum{font-family:'Fredoka','Rubik',system-ui,sans-serif!important;font-weight:600!important;fill:#1c1c1c}
.tstar{fill:#e11d2a;stroke:#9b1019;stroke-width:.6;stroke-linejoin:round}
svg text{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fresh{animation:drop .4s cubic-bezier(.3,1.5,.5,1);transform-box:fill-box;transform-origin:center}
@keyframes drop{from{transform:scale(1.35);opacity:0}to{transform:scale(1);opacity:1}}
.ghost{cursor:pointer;opacity:.93}
.ghost .hlp{stroke:#f2c14e;opacity:.85}
.pop{font-size:26px;fill:#fff;stroke:#0c2a4a;stroke-width:5px;paint-order:stroke;animation:rise 1.7s ease-out forwards;transform-box:fill-box}
.pop.bonus{fill:var(--gold);font-size:22px}
.boom text,.boom circle{pointer-events:none}
.bwave{fill:none;stroke:#ffcf33;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:bwave .7s ease-out forwards}
@keyframes bwave{from{transform:scale(.2);opacity:.95}to{transform:scale(3.4);opacity:0}}
.bflash{text-anchor:middle;dominant-baseline:central;transform-box:fill-box;transform-origin:center;animation:bflash .6s ease-out forwards}
@keyframes bflash{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.35);opacity:1}100%{transform:scale(1.7);opacity:0}}
.bdeb{text-anchor:middle;dominant-baseline:central;animation:bdeb .95s ease-out forwards}
@keyframes bdeb{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.bmock{text-anchor:middle;dominant-baseline:central;animation:bmock 1.9s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes bmock{0%{transform:translateY(12px) scale(.2);opacity:0}22%{transform:translateY(-4px) scale(1.25);opacity:1}40%{transform:translateY(-6px) rotate(-10deg)}58%{transform:translateY(-10px) rotate(10deg)}76%{transform:translateY(-12px) rotate(-6deg)}85%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.bpts{text-anchor:middle;dominant-baseline:central;fill:#ff5a5a;stroke:#3a0a0a;stroke-width:3;paint-order:stroke;font-weight:700;animation:rise 1.8s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateY(-46px)}}

/* ---- boutons flottants ---- */
.fab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;font-family:inherit;color:var(--ink);background:rgba(12,34,60,.78);backdrop-filter:blur(6px);box-shadow:0 3px 10px rgba(0,0,0,.35);font-size:22px;line-height:1;transition:transform .12s,opacity .15s}
.fab:active:not(:disabled){transform:scale(.93)}
.fab:disabled{opacity:.35;cursor:not-allowed}
.fab.sm{width:40px;height:40px;font-size:18px}
.fab .cap{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.fab .badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--gold);color:#2a1d07;font-size:11.5px;font-weight:700;line-height:19px;font-style:normal}
.fab.gold{background:linear-gradient(#ffd468,#e6a92b);color:#3a2604}
.fab.warn{background:linear-gradient(#a78bfa,#7c3aed)}
.fab.pile{border-radius:0;background:none;box-shadow:none;width:58px;height:52px;backdrop-filter:none}
.fab.pile svg{position:absolute;inset:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.fab.pile b{position:relative;font-size:16px;color:#3a2604;margin-top:-12px}
.fab.hidden{display:none}
#menuBtn{position:absolute;top:10px;left:10px;z-index:5}
#pwBtns{display:grid;grid-template-columns:repeat(2,38px);gap:6px;direction:rtl}
#pwBtns:empty{display:none}
.pwb{position:relative;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(12,34,60,.82);font-size:17px;line-height:1;cursor:pointer;padding:0;color:#fff;font-family:inherit;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3);direction:ltr}
.pwb.off{opacity:.45}
.pwb.on{background:var(--gold);border-color:#fff;opacity:1}
.pwb i{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#2a1d07;font-size:10.5px;line-height:16px;font-style:normal;padding:0 3px}
#sideR{position:absolute;right:12px;bottom:44px;display:flex;flex-direction:column;align-items:flex-end;gap:26px;z-index:5}
#sideL{position:absolute;left:12px;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:26px;z-index:5}
#fitBtn{position:absolute;right:12px;top:14px;z-index:5}
#top{position:absolute;top:26px;left:76px;right:64px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}

/* ---- adversaires ---- */
#oppBar{flex:0 0 auto;background:linear-gradient(#8593a1,#a3b0bd);border-bottom:3px solid #eef2f5;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:max(5px,env(safe-area-inset-top)) 10px 5px;position:relative;z-index:7}
#oppBar:empty,#opps:empty{display:none}
#opps{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}
.opp{display:flex;align-items:center;gap:8px;color:#0f2236;min-width:0}
.opp .av{border:3px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.opp.active .av{box-shadow:0 0 0 4px #f2c14e,0 2px 5px rgba(0,0,0,.3)}
.onl{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid #0e2a47}
.onl.off{background:#6b7280}
.av{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#10241c;font-size:16px;flex:0 0 auto}
.oinfo{display:flex;flex-direction:column;line-height:1.05}
.oname{font-size:12.5px;opacity:.85}
.oscore{font-size:20px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.backs{display:flex;gap:2px;align-items:center;min-width:0;align-self:flex-end;margin-bottom:-19px}
.backs svg{width:30px;height:auto;display:block;filter:drop-shadow(0 2px 1.5px rgba(40,60,80,.45))}

.backs small{font-size:12px;font-weight:600;opacity:.8;margin-left:3px}
.think{display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.badge2{background:var(--gold);color:#2a1d07;border-radius:6px;padding:0 5px;font-size:11px;font-weight:700;margin-left:3px}
.spyhand{display:flex;flex-wrap:wrap;gap:2px;max-width:280px;padding:2px 0}
.spyhand svg{width:36px;height:auto;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.spyhand svg.bkt .body{fill:#efe6ff;stroke:#efe6ff}
.spyhand svg.bkt .hlp{stroke:#7c3aed;stroke-width:10}
@media (max-width:720px){ .spyhand{max-width:230px} .spyhand svg{width:36px} }
.spyhand svg{width:40px}

/* ---- message et notifications ---- */
#pill{max-width:560px;background:rgba(12,34,60,.82);backdrop-filter:blur(6px);border-radius:14px;padding:6px 14px;font-size:14px;line-height:1.3;text-align:center;pointer-events:none;z-index:4}
#pill:empty{display:none}
#pill b{color:var(--gold)}
#toasts{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:100%}
#toasts div{background:rgba(10,30,54,.7);padding:3px 11px;border-radius:9px;font-size:12.5px;animation:toastA 3s ease forwards;text-align:center}
@keyframes toastA{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-size:36px;font-weight:700;color:var(--gold);text-shadow:0 3px 0 #5b3f07,0 6px 24px rgba(0,0,0,.6);white-space:nowrap;z-index:6}
#banner.show{animation:bannerA 1.9s ease-out forwards}
@keyframes bannerA{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}

/* ---- barre d'action flottante (poser / reprise / annuler) ---- */
#abar{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);display:flex;gap:6px;z-index:6;align-items:center}
#abar:empty{display:none}
#abar .btn{box-shadow:0 4px 14px rgba(0,0,0,.4);padding:10px 14px}
.undoBtn{position:relative;overflow:hidden}
.undoBtn::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:100%;background:#3a2604;transform-origin:left;animation:undoT var(--t,3.2s) linear forwards}
@keyframes undoT{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ---- main du joueur ---- */
footer{flex:0 0 auto;display:flex;align-items:flex-end;gap:10px;background:linear-gradient(#a3b0bd,#8593a1);border-top:3px solid #eef2f5;box-shadow:0 -4px 16px rgba(0,0,0,.3);padding:3px 10px max(3px,env(safe-area-inset-bottom)) 8px;position:relative;z-index:6}
#me{margin-top:-28px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px}
.meScore{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7ee08a,#2f9b48);border:3px solid #fff7df;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);box-shadow:0 2px 6px rgba(0,0,0,.3);transition:box-shadow .2s}
#me.active .meScore{box-shadow:0 0 0 4px rgba(255,255,255,.55),0 2px 6px rgba(0,0,0,.3)}
.meName{font-size:11.5px;font-weight:600;color:#0f2236;display:flex;gap:2px;align-items:center}
#hand{flex:1;display:flex;flex-wrap:wrap;gap:1px 2px;align-content:flex-start;padding:0 2px;margin-top:-34px;min-height:52px;max-height:34vh;overflow-y:auto;scrollbar-width:none}
.htile{touch-action:none;-webkit-touch-callout:none;display:block;flex:0 0 auto;background:none;border:0;padding:0;cursor:grab;transition:opacity .15s;filter:drop-shadow(0 2px 2px rgba(80,50,0,.45))}
.htile svg{display:block;width:70px;height:auto}
.htile.dragging{opacity:.25}
.htile.wait{cursor:pointer}
.htile.pick .hlp{stroke:#7c2d12;stroke-width:10}
.htile.pick{cursor:pointer}
#dragTile{position:fixed;left:0;top:0;pointer-events:none;z-index:40;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5));transition:opacity .12s}
#dragTile.snapped{opacity:0}
body.dragmode,body.dragmode *{cursor:grabbing!important}
.hslot{position:relative;flex:0 0 auto}
.hslot.drawn{animation:drawnA .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes drawnA{from{transform:translateY(-60px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.hslot.fav+.hslot:not(.fav){margin-left:5px;padding-left:6px;border-left:2px dotted rgba(28,47,66,.35)}
.hslot.fav .body{fill:#fff1c2;stroke:#fff1c2}
.hslot.bkt .body,#dragTile.bkt .body{fill:#efe6ff;stroke:#efe6ff}
.hslot.bkt .hlp,#dragTile.bkt .hlp{stroke:#7c3aed;stroke-width:10}
.tbk{opacity:1}
.hbk{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:#f2c14e;border:1.5px solid #8a5a00;font-size:12px;line-height:19px;text-align:center;pointer-events:none;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.hbtn{position:absolute;top:-2px;left:-3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(58,38,4,.35);color:#fff;font-size:11px;cursor:pointer;padding:0;line-height:20px;font-family:inherit;z-index:2}
.hbtn:not(.on){opacity:.5}
.hbtn.on{background:#7c2d12;color:var(--gold);opacity:1}
.spin{animation:spin .25s cubic-bezier(.3,1.3,.5,1);transform-origin:37px 44.33px}
@keyframes spin{from{transform:rotate(-120deg)}to{transform:none}}
.ghost.hint .hlp{animation:hintGlow 1s ease-in-out infinite}
@keyframes hintGlow{50%{stroke:#fff7d6}}
.bombable{cursor:pointer}
.bombable .hlp{stroke:#dc2626;animation:bombp 1s ease-in-out infinite}
@keyframes bombp{50%{stroke:#fca5a5}}

/* ---- fenêtres ---- */
.overlay{position:fixed;inset:0;background:rgba(5,16,32,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.overlay[hidden]{display:none}
.modal{background:#17395c;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px 22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.modal h2{margin:0 0 6px;font-size:24px}
.modal h3{margin:14px 0 6px;font-size:15.5px;color:var(--gold)}
.modal p,.modal li{font-size:14.5px;line-height:1.45;opacity:.92}
.modal ul{padding-left:20px;margin:6px 0}
.mclose{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--ink);font-size:18px;cursor:pointer}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{font-family:inherit;font-size:15px;padding:8px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.15);background:transparent;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--gold);background:rgba(242,193,78,.14)}
.opts.multi .opt{font-size:14px;padding:6px 11px}
.minirow{display:flex;gap:6px;margin-top:8px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
table.res{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
table.res th,table.res td{padding:7px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
table.res td.n{text-align:right;font-weight:600}
table.res tr.win td{color:var(--gold)}
.hero{display:flex;justify-content:center;margin:4px 0 10px}
.oppbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.helpsec{margin:4px 0 0}
.helptbl{width:100%;border-collapse:collapse;font-size:14px}
.helptbl td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top}
.helptbl td.n{text-align:right;font-weight:700;color:var(--gold);white-space:nowrap}
.lobby{text-align:center}
#fwWrap{position:fixed;inset:0;z-index:45;pointer-events:none;background:rgba(4,12,28,.55);animation:fwBg .5s ease}
#fwWrap canvas{position:absolute;inset:0;width:100%;height:100%}
.fwText{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(30px,9vw,64px);font-weight:700;color:var(--gold);text-shadow:0 4px 0 #5b3f07,0 8px 30px rgba(0,0,0,.7);white-space:nowrap;animation:fwTxt 5s ease forwards}
@keyframes fwBg{from{opacity:0}to{opacity:1}}
@keyframes fwTxt{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}20%{transform:translate(-50%,-50%) scale(1)}90%{opacity:1}100%{opacity:0}}
.stealBar{display:flex;gap:8px;background:rgba(12,34,60,.9);backdrop-filter:blur(6px);border:2px solid var(--gold);border-radius:16px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);animation:stealIn .3s ease}
@keyframes stealIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stealBar .stealT{padding:6px 6px 4px;border-radius:12px}
.stealBar .stealT svg{width:62px}
.stealT{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-family:inherit;transition:transform .12s,border-color .12s}
.stealT:hover{transform:translateY(-3px);border-color:var(--gold)}
.stealT svg{width:78px;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.stealT small{font-size:11.5px;opacity:.85}
.stealT.bkt .body{fill:#efe6ff;stroke:#efe6ff}
.stealT.bkt .hlp{stroke:#7c3aed;stroke-width:10}
#evCard{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);width:min(340px,calc(100% - 40px));background:#17395c;border:2px solid var(--gold);border-radius:18px;padding:16px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:20;text-align:center;cursor:pointer;animation:evCardIn .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes evCardIn{from{opacity:0;transform:translateX(-50%) translateY(24px) scale(.92)}to{opacity:1;transform:translateX(-50%)}}
#evCard[hidden]{display:none}
@keyframes evIn{from{opacity:0;transform:translate(-50%,-50%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#evCard .eic{font-size:44px;line-height:1.1}
#evCard .eti{font-size:18px;font-weight:700;margin:4px 0 6px}
#evCard .etx{font-size:14.5px;line-height:1.4;opacity:.92}
#evCard .etx b{color:var(--gold)}
#evCard .eok{margin-top:12px;font-size:12.5px;opacity:.6}
#evCard .ebar{height:3px;background:var(--gold);border-radius:2px;margin-top:10px;transform-origin:left;animation:undoT 15s linear forwards}
.opow{display:flex;gap:2px;font-size:12px;margin-top:1px}
.opow span{background:rgba(255,255,255,.7);border-radius:5px;padding:0 3px}
.inp{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:var(--ink);font-family:inherit;font-size:16px}
.lobby .big{font-size:44px;margin:4px 0}
.lobby p{margin:6px 0}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:999px;padding:11px 20px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spinA 1s linear infinite;margin:10px auto}
@keyframes spinA{to{transform:rotate(360deg)}}
.menuList{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menuList .btn{text-align:left;padding:12px 14px}
.histo{margin-top:12px;font-size:13px;opacity:.8;display:flex;flex-direction:column;gap:3px}
/* liste des bonus */

<script>
(() => {
'use strict';
/* ---------- Géométrie de la grille triangulaire ---------- */
const S = 64, H = S * Math.sqrt(3) / 2;
const COLORS = ['#64748b', '#e11d48', '#f97316', '#16a34a', '#2563eb', '#9333ea'];
const NAMES = ['Vous', 'Léa', 'Hugo', 'Inès'];
const PCOL = ['#f2c14e', '#5eead4', '#f472b6', '#a78bfa'];
const K = (a, b) => a + ',' + b;
const isUp = (c, r) => ((c + r) & 1) === 0;
// sommets dans l'ordre horaire
const cellVerts = (c, r) => isUp(c, r) ? [[c + 1, r], [c + 2, r + 1], [c, r + 1]] : [[c, r], [c + 2, r], [c + 1, r + 1]];
const edgeNbs = (c, r) => [[c - 1, r], [c + 1, r], isUp(c, r) ? [c, r + 1] : [c, r - 1]];
const vpx = ([vx, vy]) => [vx * S / 2, vy * H];
const vertexCells = (vx, vy) => { const o = []; for (const r of [vy - 1, vy]) for (let c = vx - 2; c <= vx; c++) o.push([c, r]); return o; };

/* ---------- Tuiles ---------- */
const TILES = [];
for (let a = 0; a <= 5; a++) for (let b = a; b <= 5; b++) for (let c = b; c <= 5; c++) TILES.push([a, b, c]);
const tsum = t => t[0] + t[1] + t[2];
const sortHand = h => h.sort((x, y) => (y.fav ? 1 : 0) - (x.fav ? 1 : 0) || x[0] - y[0] || x[1] - y[1] || x[2] - y[2]);
const hv = t => { const r = t.rot || 0; return [t[r], t[(r + 1) % 3], t[(r + 2) % 3]]; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- État ---------- */
const POWERS = [
  { k: 'gift', ic: '🎁', l: 'Donner', tip: 'Offrir une de vos tuiles à un adversaire' },
  { k: 'swap', ic: '🔄', l: 'Échanger', tip: 'Remettre une tuile dans la pioche et en tirer une autre, sans pénalité' },
  { k: 'double', ic: '✖2', l: 'Double', tip: 'Votre prochaine tuile posée compte double, bonus compris' },
  { k: 'spy', ic: '👀', l: 'Espion', tip: 'Voir les tuiles des adversaires pendant votre tour' },
  { k: 'freeze', ic: '🔒', l: 'Gel de la pioche', tip: 'Le prochain adversaire ne pourra pas piocher : s’il ne peut rien poser, il doit passer (−10)' },
  { k: 'joker', ic: '🃏', l: 'Joker', tip: 'Un coin de votre prochaine tuile peut valoir n’importe quel nombre' },
  { k: 'undo', ic: '🔁', l: 'Reprise', tip: 'Reprendre la tuile que vous venez de poser et rejouer (vous perdez ses points)', fixed: true },
  { k: 'steal', ic: '🎯', l: 'Vol', tip: 'Trois tuiles de l’adversaire sont révélées au hasard : prenez celle de votre choix' },
  { k: 'bomb', ic: '💣', l: 'Bombe', tip: 'Retirer une tuile en bordure du plateau ; son poseur perd ses points' },
  { k: 'rafale', ic: '⚡', l: 'Rafale', tip: 'Poser deux tuiles dans le même tour' },
  { k: 'chest', ic: '🎲', l: 'Coffre surprise', tip: 'Compléter un hexagone fait gagner un bonus au hasard', passive: true }
];
const PW = Object.fromEntries(POWERS.map(x => [x.k, x]));
const withBonus = () => cfg.mode !== 'normal';
const advOn = () => cfg.adv !== 'non';
const undoOn = () => cfg.undo === 'oui';
const isOn = k => !!(PW[k] && (PW[k].fixed ? undoOn() : (withBonus() && cfg.bonus.includes(k))));
let cfg = { opp: 1, level: 'expert', mode: 'bonus', dist: 'tiles', btiles: 8, uses: 1, hints: 2, undo: 'non', adv: 'oui', bonus: POWERS.filter(x => !x.fixed).map(x => x.k) };
let G = null, sel = null, ghost = null, targetMap = new Map(), freshK = null, aiTimer = null;
// ONLINE : partie en ligne ; ME : siège du joueur local (0 hors ligne)
let ONLINE = false, ME = 0, SEATS = null;
const cur = () => G.players[G.current];
const meP = () => G.players[ME];
const humanTurn = () => !!G && !G.over && G.current === ME && !cur().ai;
// formulation « vous » seulement hors ligne (en ligne, le journal est partagé : on écrit les prénoms)
const vous = p => !!(p && p.human && !ONLINE);

/* ---------- Règles ---------- */
function evalMove(t, c, r, rot, joker) {
  const k = K(c, r);
  if (G.board.has(k)) return null;
  const vs = cellVerts(c, r);
  const vals = [t[rot], t[(rot + 1) % 3], t[(rot + 2) % 3]];
  let jk = -1;
  for (let i = 0; i < 3; i++) {
    const v = G.vmap.get(K(vs[i][0], vs[i][1]));
    if (v !== undefined && v !== vals[i]) { if (joker && jk < 0) jk = i; else return null; }
  }
  if (jk >= 0) vals[jk] = G.vmap.get(K(vs[jk][0], vs[jk][1]));
  const nbs = edgeNbs(c, r).filter(n => G.board.has(K(n[0], n[1])));
  if (G.board.size > 0 && nbs.length === 0) return null;
  if (G.board.size === 0) {
    const base0 = vals[0] + vals[1] + vals[2];
    return { c, r, rot, vals, base: base0, bonus: 0, label: '', pts: base0, jk: -1 };
  }
  const base = vals[0] + vals[1] + vals[2];
  let bonus = 0, label = '';
  let hex = 0;
  for (const v of vs) if (vertexCells(v[0], v[1]).every(([cc, rr]) => (cc === c && rr === r) || G.board.has(K(cc, rr)))) hex++;
  if (hex) { bonus = 40 + 10 * hex; label = ['', 'Hexagone', 'Double hexagone', 'Triple hexagone'][hex]; }
  else if (nbs.length === 1) {
    const nv = new Set(cellVerts(nbs[0][0], nbs[0][1]).map(v => K(v[0], v[1])));
    const opp = vs.find(v => !nv.has(K(v[0], v[1])));
    if (G.vmap.has(K(opp[0], opp[1]))) { bonus = 40; label = 'Pont'; }
  }
  return { c, r, rot, vals, base, bonus, label, pts: base + bonus, jk };
}
function candidates() {
  if (G.board.size === 0) return [[0, 0]];
  const m = new Map();
  for (const t of G.board.values()) for (const n of edgeNbs(t.c, t.r)) { const k = K(n[0], n[1]); if (!G.board.has(k)) m.set(k, n); }
  return [...m.values()];
}
function movesFor(t, cands = candidates(), joker = false) {
  const out = [];
  for (const [c, r] of cands) {
    const seen = new Set();
    for (let rot = 0; rot < 3; rot++) {
      const m = evalMove(t, c, r, rot, joker);
      if (m) { const s = m.vals.join() + '|' + m.jk; if (!seen.has(s)) { seen.add(s); out.push(m); } }
    }
  }
  return out;
}
function allMoves(hand, joker = false) {
  const cands = candidates(), out = [];
  hand.forEach((t, ti) => movesFor(t, cands, joker).forEach(m => { m.ti = ti; out.push(m); }));
  return out;
}

/* ---------- Déroulement ---------- */
function newGame(prevStarter) {
  clearTimeout(aiTimer);
  G = { gid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), cfg: JSON.parse(JSON.stringify(cfg)),
    players: [], round: 0, level: cfg.level, mode: null, spy: 0, chest: withBonus() && cfg.bonus.includes('chest'), log: [], logId: 0 };
  const n = ONLINE ? SEATS.length : cfg.opp + 1;
  for (let i = 0; i < n; i++) {
    const powers = {}; POWERS.forEach(x => { if (!x.passive) powers[x.k] = x.fixed ? (undoOn() ? Infinity : 0) : (withBonus() && cfg.dist === 'start' && cfg.bonus.includes(x.k)) ? cfg.uses : 0; });
    G.players.push({ name: ONLINE ? SEATS[i].name : NAMES[i], uid: ONLINE ? SEATS[i].uid : null, human: ONLINE ? i === ME : i === 0, ai: !ONLINE && i > 0,
      score: 0, hand: [], color: PCOL[i], powers, hints: cfg.hints });
  }
  G.nextStarter = prevStarter == null ? null : (prevStarter + 1) % G.players.length;
  shownEnd = null; EVQ.length = 0; if (evShown) nextEv(); recapFrom = 0;
  newRound();
}
function newRound() {
  clearTimeout(aiTimer); hideModal();
  G.round++; G.board = new Map(); G.vmap = new Map(); G.lastK = null; G.passes = 0; G.over = false; G.result = null; G.draws = 0; G.undoSnap = null;
  G.pool = shuffle(TILES.map(t => t.slice()));
  // tuiles ✨ : certaines tuiles portent un bonus, gagné en les posant
  const bks = (withBonus() && cfg.dist === 'tiles') ? POWERS.filter(x => !x.passive && !x.fixed && cfg.bonus.includes(x.k)).map(x => x.k) : [];
  if (bks.length) shuffle(G.pool.slice()).slice(0, cfg.btiles).forEach(t => { t.bk = bks[Math.random() * bks.length | 0]; });
  const n = G.players.length, deal = n === 2 ? 9 : 7;
  G.players.forEach(p => { p.hand = sortHand(G.pool.splice(0, deal)); p.roundStart = p.score; });
  G.freezeNext = false; G.drawFrozen = false; G.extra = false; G.afterBonus = null;
  sel = null; ghost = null; targetMap = new Map();
  let starter = G.nextStarter;
  if (starter == null) {
    // première partie : le joueur qui a le plus fort triple (sinon la plus forte tuile) commence
    let best = null;
    G.players.forEach((p, pi) => p.hand.forEach(t => {
      const rank = (t[0] === t[2] ? 1000 : 0) + tsum(t);
      if (!best || rank > best.rank) best = { pi, rank };
    }));
    starter = best.pi;
  }
  G.starter = starter; G.nextStarter = (starter + 1) % n;
  G.current = starter;
  view = { x: 0, y: 0, k: 1 }; fitView(false);
  const p = cur();
  addLog(vous(p) ? 'Vous commencez : posez la tuile de votre choix' : `${p.name} commence`);
  render();
  if (p.ai) aiTimer = setTimeout(aiTurn, 1100);
}
const UNDO_MS = 3500;
function placeMove(pi, ti, m) {
  const p = G.players[pi];
  G.undoSnap = null; // le joueur suivant a joué : plus de reprise possible pour le précédent
  const snap = { seat: pi, draws: G.draws, lastK: G.lastK, passes: G.passes, freezeNext: G.freezeNext, spy: G.spy, chest: null, bk: null };
  const placedTile = p.hand.splice(ti, 1)[0];
  const k = K(m.c, m.r);
  cellVerts(m.c, m.r).forEach((v, i) => G.vmap.set(K(v[0], v[1]), m.vals[i]));
  const cell = { c: m.c, r: m.r, vals: m.vals, owner: pi, jk: m.jk ?? -1, tile: null, pts: 0 };
  const mult = p.doubleArmed ? 2 : 1;
  if (mult === 2) p.doubleArmed = false;
  if (m.jk >= 0) p.jokerArmed = false;
  cell.tile = placedTile; cell.pts = m.pts * mult;
  G.board.set(k, cell);
  p.score += m.pts * mult; G.lastK = k; freshK = k; G.passes = 0;
  addLog(`${p.name} ${vous(p) ? 'posez' : 'pose'} ${m.vals.join('-')} : +${m.pts * mult}${m.label ? ' (' + m.label + ' +' + m.bonus + ')' : ''}${mult === 2 ? ' ✖2' : ''}${m.jk >= 0 ? ' 🃏' : ''}`);
  sel = null; ghost = null; targetMap = new Map();
  const popTxt = '+' + m.base * mult, popSub = [m.bonus ? m.label + ' +' + m.bonus * mult : '', mult === 2 ? '✖2 Double !' : ''].filter(Boolean).join(' · ');
  if (ONLINE) { G.popId = (G.popId || 0) + 1; G.pop = { id: G.popId, c: m.c, r: m.r, txt: popTxt, sub: popSub }; seenPop = G.popId; }
  render();
  ensureVisible(m.c, m.r);
  pop(m.c, m.r, popTxt, popSub);
  if (mult === 2 && !m.bonus) banner('✖2 Double ! +' + m.pts * 2);
  else if (m.bonus) banner((m.label === 'Pont' ? '🌉 ' : /exagone/.test(m.label) ? '⬡ ' : '⭐ ') + m.label + ' ! +' + m.bonus);
  if (p.hand.length === 0) { finishGame(pi); return; }
  // --- bonus : poser une tuile ✨ (ou compléter un hexagone) REMPLIT votre réserve ; vous activez le pouvoir quand vous voulez via les boutons ---
  const grant = (w, hex) => {
    p.powers[w.k] = (p.powers[w.k] || 0) + 1;
    addLog(`${hex ? '🎲 Coffre surprise' : '✨ Bonus'} : ${p.name} ${vous(p) ? 'gagnez' : 'gagne'} ${w.ic} ${w.l}`, null, pi !== ME);
    pevent(pi, 'gain', w.k, { via: hex ? 'chest' : 'tile' }); // carte explicative (vous toujours ; adversaire si l'option est activée)
  };
  if (withBonus() && cfg.dist === 'tiles' && placedTile.bk) {
    const w = POWERS.find(x => x.k === placedTile.bk);
    if (w) { snap.bk = placedTile.bk; placedTile.bk = null; grant(w, false); }
  }
  if (withBonus() && G.chest && /exagone/.test(m.label)) {
    const pool = POWERS.filter(x => !x.passive && !x.fixed && cfg.bonus.includes(x.k));
    if (pool.length) { const w = pool[Math.random() * pool.length | 0]; snap.chest = w.k; grant(w, true); }
  }
  endTurnAfterPlace(pi, placedTile, m, mult, cell, snap, true);
}
function maybeAfter() { if (G && G.afterBonus) { const f = G.afterBonus; G.afterBonus = null; f(); } }
function endTurnAfterPlace(pi, placedTile, m, mult, cell, snap, allowUndo) {
  const p = G.players[pi];
  if (p.rafaleArmed) {
    p.rafaleArmed = false; G.extra = true; G.draws = 0; G.aiPowerUsed = true;
    addLog(`⚡ Rafale : ${p.name} ${vous(p) ? 'rejouez' : 'rejoue'} !`); setTimeout(() => banner('⚡ Rafale : encore une !'), 700);
    render();
    if (p.ai) aiTimer = setTimeout(aiTurn, 1100);
    return;
  }
  if (allowUndo && !p.ai && p.powers.undo > 0 && !G.extra) Object.assign(snap, { k: K(cell.c, cell.r), pts: cell.pts, tile: placedTile, mult, jk: m.jk ?? -1 });
  else snap.k = null;
  nextTurn(snap.k ? snap : null);
}
// déclenche un bonus posé ; appelle done() une fois résolu (y compris après un choix du joueur)
function resolveBonus(pi, kind, m, cell, done) {
  const p = G.players[pi], human = (pi === ME) && !p.ai, adv = pi !== ME;
  const show = txt => { if (!adv || advOn()) banner(txt); };
  if (kind === 'double') {
    p.score += m.pts; cell.pts += m.pts;
    addLog(`✖2 ${vous(p) ? 'Vous doublez votre tuile' : p.name + ' double sa tuile'} (+${m.pts})`);
    pevent(pi, 'use', 'double', {}); show('✖2 Double ! +' + m.pts);
    return done();
  }
  if (kind === 'joker') { p.jokerArmed = true; addLog(`🃏 ${vous(p) ? 'Vous armez un Joker' : p.name + ' arme un Joker'}`); pevent(pi, 'use', 'joker', {}); show('🃏 Joker !'); return done(); }
  if (kind === 'spy') {
    const oi = G.players.findIndex((q, i) => i !== pi && q.hand.length);
    if (oi >= 0) { if (human) G.spy = pi + 1; pevent(pi, human ? 'spy' : 'use', 'spy', { target: oi }); }
    show('👀 Espion !'); return done();
  }
  if (kind === 'freeze') {
    const tgt = (pi + 1) % G.players.length;
    G.freezeNext = true; G.freezeBy = pi;
    addLog(`🔒 ${G.players[tgt].name} ne pourra pas piocher au prochain tour`); pevent(pi, 'use', 'freeze', { target: tgt }); show('🔒 Gel !');
    return done();
  }
  if (kind === 'rafale') { p.rafaleArmed = true; addLog(`⚡ ${vous(p) ? 'Vous posez' : p.name + ' pose'} une 2ᵉ tuile`); pevent(pi, 'use', 'rafale', {}); show('⚡ Rafale !'); return done(); }
  if (kind === 'gift') {
    const opps = G.players.filter((q, i) => i !== pi);
    if (p.hand.length < 2 || !opps.length) return done();
    if (human) { G.mode = 'gift'; G.afterBonus = done; G.msg = ''; sel = null; ghost = null; render(); return; }
    let ti = 0; p.hand.forEach((t, i) => { if (tsum(t) > tsum(p.hand[ti])) ti = i; });
    const to = opps.reduce((a, b) => b.score > a.score ? b : a);
    giveTile(p, ti, to); return done();
  }
  if (kind === 'swap') {

function moveHandDrag(x, y) {
  y += hd.off;
  dragEl.style.transform = `translate(${x - hd.w / 2}px,${y - hd.h * 2 / 3}px)`;
  const R = svg.getBoundingClientRect();
  let bestK = null;
  if (x >= R.left && x <= R.right && y >= R.top && y <= R.bottom) {
    const wx = (x - R.left - view.x) / view.k, wy = (y - R.top - view.y) / view.k;
    let bd = S * .75;
    for (const k of targetMap.keys()) {
      const [c, r] = k.split(',').map(Number), p = cellPts(c, r);
      const d = Math.hypot((p[0][0] + p[1][0] + p[2][0]) / 3 - wx, (p[0][1] + p[1][1] + p[2][1]) / 3 - wy);
      if (d < bd) { bd = d; bestK = k; }
    }
  }
  if (!bestK && G.board.size === 0 && targetMap.has('0,0') && x >= R.left && x <= R.right && y >= R.top && y <= R.bottom) bestK = '0,0';
  if (bestK) {
    if (!ghost || ghost.k !== bestK) {
      const list = targetMap.get(bestK);

      render();
    }

}

}

  } else {
    G.log.filter(x => x.id > seenLog && (!x.adv || advOn())).forEach(x => toast(x.t)); seenLog = G.logId || 0;
    const newPop = G.pop && G.pop.id > seenPop ? G.pop : null;
    if (newPop) { seenPop = newPop.id; freshK = K(newPop.c, newPop.r); }
    render();
    if (newPop) { ensureVisible(newPop.c, newPop.r); pop(newPop.c, newPop.r, newPop.txt, newPop.sub); }
    if (G.bn && G.bn.id > seenBn) { seenBn = G.bn.id; bannerShow(G.bn.t); }
    (G.pev || []).filter(e => e.id > seenPev && e.seat !== ME).forEach(e => { if (e.k === 'bomb' && e.kind === 'use' && e.d.c != null) { ensureVisible(e.d.c, e.d.r); boomFx(e.d.c, e.d.r, e.d.pts, e.d.owner === ME); } if (advOn() || e.kind === 'use') announce(e); }); seenPev = G.pevId || 0;
  }
  if (G.over && G.result && shownEnd !== G.gid) setTimeout(showEnd, fresh ? 0 : 900);
  if (!wasMyTurn && humanTurn()) notifyTurn();
}
function notifyTurn() {
  try { navigator.vibrate && navigator.vibrate(180); } catch (e) {}
  if (document.hidden) document.title = '🔔 À vous ! · Triolet';
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = 'Triolet'; });
function knownFriend() {
  const s = (G && ONLINE) ? G.players.map(p => ({ uid: p.uid, name: p.name })) : lastSeats;
  return s && s.length === 2 ? s.find(x => x.uid !== myUid) : null;
}
// créer une partie : directement contre l'ami connu, sinon une invitation en attente
function createOnline() {
  const friend = knownFriend();
  if (friend) {
    SEATS = [{ uid: myUid, name: myName }, friend]; ME = 0; ONLINE = true;
    newGame(null);
    return;
  }
  const base = gameVer;
  Net.tx(curV => ((curV ? curV.ver : 0) !== base) ? undefined : { ver: base + 1, status: 'waiting', host: { uid: myUid, name: myName }, cfg: JSON.parse(JSON.stringify(cfg)), s: null, t: Date.now() })
    .then(ok => { if (!ok && lastRemote) applyRemote(lastRemote); }).catch(netError);
}
function joinOnline(val) {
  Object.assign(cfg, val.cfg || {});
  SEATS = [val.host, { uid: myUid, name: myName }]; ME = 1; ONLINE = true; gameVer = val.ver;
  newGame(null);
}
function confirmAbandon() {
  showModal(`<h2>Nouvelle partie ?</h2><p>La partie en cours sera abandonnée pour vous deux.</p>
    <div class="mfoot"><button class="btn ghostbtn" id="mNo">Continuer la partie</button><button class="btn primary" id="mYes">Nouvelle partie</button></div>`);
  $('mNo').onclick = hideModal; $('mYes').onclick = showSetup;
}
function startTraining() {
  TRAINING = true; ONLINE = false; ME = 0;
  showSetup();
}
function leaveTraining() {
  clearTimeout(aiTimer); TRAINING = false; G = null; hideModal(); firstLoad = true; lastSynced = '';
  if (lastRemote !== undefined) applyRemote(lastRemote); else showLobby();
}
function lobbyFoot() {
  return `<div class="mfoot" style="justify-content:center;flex-wrap:wrap">${isStandalone() ? '' : '<button class="btn ghostbtn small" id="lInst">📲 Installer</button>'}<button class="btn ghostbtn small" id="lTrain">🤖 S’entraîner contre l’ordinateur</button><button class="btn ghostbtn small" id="lOut">🔑 Changer de mot de passe</button></div>`;
}
function bindLobbyFoot() { $('lTrain').onclick = startTraining; $('lOut').onclick = logout; if ($('lInst')) $('lInst').onclick = installApp; }
function showLobby() {
  showModal(`<div class="lobby"><div class="big">🎲</div><h2>Bonjour ${myName} !</h2>
    <p>Aucune partie en cours.</p><p style="font-size:13px;opacity:.7">Votre ami doit utiliser le même mot de passe pour voir votre partie.</p>

}
function showWaiting(val) {
  showModal(`<div class="lobby"><div class="big">⏳</div><h2>En attente de votre ami…</h2>
    <p>Dites-lui d’ouvrir le jeu : il verra votre invitation.</p><div class="spinner"></div>
    <p><button class="btn ghostbtn small" id="lCancel">Annuler la partie</button></p></div>${lobbyFoot()}`);
  $('lCancel').onclick = () => { const base = gameVer; Net.tx(c => (c && c.ver === base) ? null : undefined).catch(netError); };
  bindLobbyFoot();
}
function showInvite(val) {
  const n = POWERS.filter(x => !x.passive && !x.fixed && (val.cfg.bonus || []).includes(x.k)).map(x => x.ic).join(' ');
  showModal(`<div class="lobby"><div class="big">🎉</div><h2>${val.host.name} vous invite !</h2>
    <p>Bonus de la partie : ${n || 'aucun'}</p>
    <p style="margin-top:14px"><button class="btn primary" id="lJoin">Rejoindre la partie</button></p></div>${lobbyFoot()}`);
  $('lJoin').onclick = () => { hideModal(); joinOnline(val); };
  bindLobbyFoot();
}
// stockage local (prénom, identifiant de l'appareil, salle) ; le suffixe permet plusieurs joueurs factices en test
let SK = 'trio_';
const lsGet = k => { try { return localStorage.getItem(SK + k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(SK + k) : localStorage.setItem(SK + k, v); } catch (e) {} };
// le mot de passe devient l'adresse secrète de la partie (empreinte SHA-256)
async function roomOf(pw) {
  const data = new TextEncoder().encode('triominos|' + pw.trim());
  const h = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function logout() { lsSet('room', null); location.reload(); }
function showLogin(err) {
  G = null; ONLINE = false;
  const fixedPw = !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.motDePasse);
  showModal(`<div class="lobby"><div class="hero"><svg width="150" height="70" viewBox="0 0 150 70">
      ${triSVG([[40, 4], [74, 64], [6, 64]], [5, 5, 5], { fs: 15 })}${triSVG([[40, 4], [108, 4], [74, 64]], [5, 5, 3], { fs: 15 })}${triSVG([[108, 4], [142, 64], [74, 64]], [3, 5, 1], { fs: 15 })}
    </svg></div><h2>Triolet</h2><p>Partie privée entre amis.</p></div>
    <form id="lForm" style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
      <label style="font-size:14px">Votre prénom<input id="lName" class="inp" maxlength="14" autocomplete="given-name" value="${(lsGet('name') || '').replace(/"/g, '')}"></label>
      ${fixedPw ? '' : '<label style="font-size:14px">Mot de passe de la partie<input id="lPw" class="inp" type="password" autocomplete="current-password"></label><p style="font-size:12.5px;opacity:.7;margin:0">Le même que votre ami, au caractère près. Il reste enregistré sur cet appareil.</p>'}
      <p id="lErr" style="color:#fca5a5;font-size:13.5px;margin:0">${err || ''}</p>
      <button class="btn primary" type="submit" id="lGo">Entrer</button>
    </form>
    <div class="mfoot" style="justify-content:center"><button class="btn ghostbtn small" id="lTrain">🤖 S’entraîner contre l’ordinateur</button></div>`);
  $('lTrain').onclick = startTraining;
  $('lForm').onsubmit = async e => {
    e.preventDefault();
    const name = $('lName').value.trim(), pw = fixedPw ? String(window.FIREBASE_CONFIG.motDePasse) : $('lPw').value;
    if (!name) return $('lErr').textContent = 'Indiquez votre prénom.';
    if (pw.trim().length < 8) return $('lErr').textContent = 'Le mot de passe doit faire au moins 8 caractères.';
    lsSet('name', name); lsSet('room', await roomOf(pw));
    enterRoom();
  };
}
function enterRoom() {
  let uid = lsGet('uid');
  if (!uid) { uid = Math.random().toString(36).slice(2) + Date.now().toString(36); lsSet('uid', uid); }
  Net.connect(lsGet('room'));
  onSignedIn({ uid, displayName: lsGet('name') });
}
function netError(err) {
  const denied = /permission|PERMISSION_DENIED/i.test(String(err && (err.code || err.message || err)));
  const room = lsGet('room') || '';
  showModal(`<div class="lobby"><div class="big">${denied ? '⛔' : '📡'}</div><h2>${denied ? 'Accès refusé' : 'Problème de connexion'}</h2>
    <p>${denied ? 'Mot de passe incorrect.' : 'Impossible de joindre le serveur. Vérifiez votre connexion.'}</p>
    ${denied ? `<details style="text-align:left;margin-top:12px;font-size:13px;opacity:.85"><summary style="cursor:pointer">Installation : empreinte de ce mot de passe</summary>
      <p>Lors de l’installation, copiez cette empreinte dans les règles Firebase (voir le guide). Elle ne permet pas de retrouver le mot de passe.</p>
      <input class="inp" id="lHash" readonly value="${room}" style="font-size:12px;font-family:monospace">
      <p style="margin-top:8px"><button class="btn small" id="lCopy">Copier l’empreinte</button> <span id="lCopied" style="opacity:.8"></span></p></details>` : ''}</div>
    <div class="mfoot" style="justify-content:center"><button class="btn ghostbtn small" id="lOut">🔑 Changer de mot de passe</button><button class="btn primary small" id="lRe">Réessayer</button></div>`);
  $('lOut').onclick = logout;
  $('lRe').onclick = () => location.reload();
  if ($('lCopy')) $('lCopy').onclick = () => {
    const f = $('lHash'); f.select();
    (navigator.clipboard ? navigator.clipboard.writeText(f.value) : Promise.reject()).then(() => $('lCopied').textContent = 'Copiée ✓')
      .catch(() => { try { document.execCommand('copy'); $('lCopied').textContent = 'Copiée ✓'; } catch (e) { $('lCopied').textContent = 'Sélectionnez et copiez le texte'; } });
  };
}
function onSignedIn(user) {
  myUid = user.uid;
  myName = (user.displayName || 'Joueur').slice(0, 14);
  showModal('<div class="lobby"><div class="spinner"></div><p>Connexion à la partie…</p></div>');
  Net.watchGame(onRemote, netError);
  Net.presence(myUid, myName);
  Net.watchPresence(pr => { PRESENCE = pr || {}; if (G && ONLINE) renderPlayers(); });
}

/* --- Firebase (SDK chargé depuis le CDN de Google) --- */
async function FireNet(config) {
  const V = '10.12.2', B = `https://www.gstatic.com/firebasejs/${V}/`;
  const [A, D] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-database.js')]);
  const app = A.initializeApp(config), db = D.getDatabase(app);
  let base = null;
  const r = path => D.ref(db, base + path);
  return {
    connect(room) { base = 'rooms/' + room + '/'; },
    watchGame(cb, err) { D.onValue(r('game'), s => cb(s.val()), err); },
    async tx(fn) {
      let aborted = false;
      const res = await D.runTransaction(r('game'), cur => { const v = fn(cur); if (v === undefined) aborted = true; return v; }, { applyLocally: false });
      return res.committed && !aborted;
    },
    presence(uid, name) {
      const me = r('presence/' + uid);
      D.onValue(D.ref(db, '.info/connected'), s => { if (s.val()) { D.onDisconnect(me).remove(); D.set(me, { name, t: Date.now() }); } });
    },
    watchPresence(cb) { D.onValue(r('presence'), s => cb(s.val() || {}), () => {}); }
  };
}
/* --- serveur factice pour les tests locaux (?mock=nom) --- */
function MockNet(uid) {
  const KEY = 'triomock', bc = new BroadcastChannel(KEY), cbs = [], pcbs = [];
  let room = '';
  const all = () => JSON.parse(localStorage.getItem(KEY) || '{}');
  const read = () => all()[room] || {};
  const emit = () => { const d = read(); cbs.forEach(cb => cb(d.game || null)); pcbs.forEach(cb => cb(d.presence || {})); };
  const writeRoom = d => { const a = all(); a[room] = d; localStorage.setItem(KEY, JSON.stringify(a)); bc.postMessage(1); setTimeout(emit, 5); };
  bc.onmessage = emit;
  return {
    connect(r) { room = r; },
    watchGame(cb, err) { const ok = localStorage.getItem(KEY + '_allow'); if (ok && ok !== room) return setTimeout(() => err({ code: 'PERMISSION_DENIED' }), 40); cbs.push(cb); setTimeout(() => cb(read().game || null), 40); },
    async tx(fn) { await new Promise(r => setTimeout(r, 25)); const d = read(), nv = fn(d.game || null); if (nv === undefined) return false; d.game = nv; writeRoom(d); return true; },
    presence(id, name) { const d = read(); d.presence = d.presence || {}; d.presence[id] = { name }; writeRoom(d);
      addEventListener('beforeunload', () => { const d = read(); if (d.presence) delete d.presence[id]; writeRoom(d); }); },
    watchPresence(cb) { pcbs.push(cb); setTimeout(() => cb(read().presence || {}), 40); }
  };
}
/* --- application installable (PWA) --- */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
addEventListener('appinstalled', () => { installEvt = null; toast('📲 Triolet est installé !'); });
function installApp() {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; }); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  showModal(`<button class="mclose" id="mX">✕</button><h2>📲 Installer Triolet</h2>
    ${ios ? '<p>Dans Safari : touchez le bouton <b>Partager</b> (carré avec une flèche), puis <b>Sur l’écran d’accueil</b>.</p>'
          : '<p>Dans Chrome : menu <b>⋮</b> en haut à droite, puis <b>Installer l’application</b> (ou <b>Ajouter à l’écran d’accueil</b>).</p>'}
    <p style="opacity:.75;font-size:13.5px">Le jeu s’ouvrira ensuite en plein écran, comme une vraie application.</p>`);
  $('mX').onclick = hideModal;
}
function registerSW() {
  if (!('serviceWorker' in navigator) || !/^https:|^http:\/\/localhost/.test(location.href)) return;
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
async function boot() {
  applyView(false);
  registerSW();
  const mock = new URLSearchParams(location.search).get('mock');
  const conf = window.FIREBASE_CONFIG;
  // diagnostic affiché si le mode en ligne ne peut pas démarrer
  if (!mock) {
    if (conf === undefined) CONF_ERR = 'Le fichier <b>config.js</b> a été trouvé mais contient une erreur, ou ne définit pas <code>window.FIREBASE_CONFIG</code>.';
    else if (conf === null) CONF_ERR = 'Le fichier <b>config.js</b> est introuvable : il doit être à côté de index.html, avec exactement ce nom.';
    else if (!conf.apiKey || /COLLEZ|VOTRE/i.test(conf.apiKey)) CONF_ERR = '<b>config.js</b> contient encore les valeurs d’exemple : collez celles de votre projet Firebase.';
    else if (!conf.databaseURL || /votre-projet/i.test(conf.databaseURL)) CONF_ERR = 'Il manque <b>databaseURL</b> (ou c’est l’exemple) dans config.js.';
    else if (navigator.onLine === false) CONF_ERR = '📡 Pas de connexion internet : vous pouvez jouer contre l’ordinateur en attendant.';
  }
  try {
    if (mock) { SK = 'trio_' + mock + '_'; Net = MockNet(mock); window.__dbg = { G: () => G, finish: wi => finishGame(wi) }; }
    else if (!CONF_ERR) Net = await FireNet(conf);
  } catch (e) { Net = null; console.error(e); CONF_ERR = 'Firebase n’a pas pu démarrer : ' + String(e && e.message || e).replace(/</g, '&lt;'); }
  if (!Net) { TRAINING = true; return showSetup(); } // pas de configuration : jeu contre l'ordinateur
  if (lsGet('room') && lsGet('name')) enterRoom(); else showLogin();
}
boot();
})();
